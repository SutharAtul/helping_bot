[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
markers =
    unit: marks unit tests (fast, isolated)
    integration: marks integration tests (api, services, database)
filterwarnings =
    ignore::DeprecationWarning

